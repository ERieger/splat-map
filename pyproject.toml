[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vine360"
version = "0.1.0"
description = "Orchestration and project-management application for 360-degree and conventional 3D Gaussian Splatting capture of vineyards."
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=2.0",
    "Pillow>=10.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
# COLMAP's official Python bindings (M4 SfM adapter) -- see docs/adr/0007.
sfm = [
    "pycolmap>=4.0",
]
# The same bindings built with CUDA 12 -- GPU SIFT extraction/matching,
# picked automatically (pycolmap's Device.auto). Use INSTEAD of `sfm`, never
# both: the two packages install the same `pycolmap` module.
sfm-cuda = [
    "pycolmap-cuda12>=4.2",
]
# Bundles real ffmpeg/ffprobe binaries with no system install needed.
ingest-ffmpeg = [
    "static-ffmpeg",
]
# SAM 3 masking backend (M3) -- see docs/adr/0008. Large; gated weights.
# torch/torchvision should be installed from a CUDA-matched index (e.g.
# https://download.pytorch.org/whl/cu126) rather than plain PyPI.
masking = [
    "torch",
    "torchvision",
    "transformers>=4.56",
    "huggingface_hub",
    "accelerate",
]
# A future desktop UI milestone (M6) is expected to add PySide6; the CLI's
# own argparse/dataclasses choice over Typer/Pydantic is unaffected -- see
# docs/adr/0001-stdlib-first-cli.md and docs/adr/0006-real-dependencies-for-m2-plus.md.

[project.scripts]
vine360 = "vine360.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: makes a real network call (e.g. to Hugging Face); skip with -m 'not network' when offline",
]
